spring.application.name=ms-patient-mysql
server.port=8091
spring.datasource.url=jdbc:mysql://mysql-db:3306/patientdb
spring.datasource.username=hamza
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-registry:8888/eureka
